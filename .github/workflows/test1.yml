name: "Hola Mundo"

on: 
    push:
        branches:
            - main
    pull_request:
        branches:
            - main

jobs:
    job1:
        runs-on: ubuntu-latest
        steps:
            - name: "Imprimir Hola Mundo"
              run: echo "Hola Mundo"

            - name: "Touch file"
              run: touch hola.txt

            - name: "Set text"
              run: echo "Hola Mundo" >> hola.txt

            - name : "Read File"
              run: cat hola.txt

    job2:
        runs-on: ubuntu-latest
        needs: job1
        steps:
            - name: Checkout
              uses: actions/checkout@v4.1.7

            - name: "ls"
              run: ls -la

            - name: "Set up Node.js environment"
              uses: actions/setup-node@v4.0.3
              with:
                  node-version: 'latest'

            - name: "Node.js version"
              run: node --version

                

            