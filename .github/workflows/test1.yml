name: "Hola Mundo"

on: 
    push:
        branches:
            - main
    pull_request:
        branches:
            - main

jobs:
    job1:
        runs-on: ubuntu-latest
        steps:
            - name: "Imprimir Hola Mundo"
              run: echo "Hola Mundo"

            - name: "Touch file"
              run: touch hola.txt

            - name: "Set text"
              run: echo "Hola Mundo" >> hola.txt

            - name : "Read File"
              run: cat hola.txt

    job2:
        runs-on: ubuntu-latest
        needs: job1
        steps:
            - name: "ls"
              run: ls -la